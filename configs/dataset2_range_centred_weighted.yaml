# configs/dataset2_range_centred_weighted.yaml
# ============================================
# Offline experiment: dataset2_range_centred_fixation.yaml, but trained on ALL windows
# with non-fixation windows weighted 0.2 (cv.regression_train_windows: weighted).
# Uses future samples. Reuses the range_centred processed data: run only
# train_classical and compare.

data:
  datasets_to_load:
    - "dataset2"
  window_channel_mode: "all_eog"

preprocessing:
  drift_removal_method: "robust_mean"
  baseline_window_sec: 60.0
  baseline_causal: false
  baseline_clip_mad: 3.0
  context_baselines:
    - ["robust_mean", 30.0]
    - ["robust_mean", 120.0]
  context_lags_sec: [1.0, 2.0, 4.0, 8.0]
  context_range_windows_sec: [60.0, 120.0, 240.0]
  context_range_quantiles: [[0.10, 0.90], [0.05, 0.95]]

cv:
  regression_train_windows: "weighted"
  regression_nonfixation_weight: 0.2

paths:
  data_processed: "data/processed_range_centred"
  results: "reports/experiments/range_centred_weighted"
  reports_figures: "reports/experiments/range_centred_weighted/figures"
