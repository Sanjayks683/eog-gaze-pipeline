# configs/dataset3_robust_line_causal.yaml
# ========================================
# Dataset 3 (Monopolar Non-Stationary: 8 subjects, free head movement), real-time
# baseline with the settings of dataset2_robust_line_causal.yaml.
# The target gaze angles are defined in a face frame that rotates with the head
# (Barbara et al., BSPC 90, 2024), so they already account for head pose. What this
# pipeline does not model is the slow vestibulo-ocular eye movement during head turns.
# Kernel SVC/SVR are skipped (CPU-only); the random forest runs on the CPU, XGBoost
# (cv.xgb_device) and the deep model on the GPU.
#
#   python main.py --config configs/dataset3_robust_line_causal.yaml --phase preprocess
#   python main.py --config configs/dataset3_robust_line_causal.yaml --phase train_classical
#   python main.py --config configs/dataset3_robust_line_causal.yaml --phase train_deep
#   python main.py --config configs/dataset3_robust_line_causal.yaml --phase compare

data:
  datasets_to_load:
    - "dataset3"
  window_channel_mode: "all_eog"

preprocessing:
  drift_removal_method: "robust_line"
  baseline_window_sec: 60.0
  baseline_causal: true
  baseline_clip_mad: 3.0

cv:
  classical_classifiers: ["rf"]
  classical_regressors: ["xgb"]
  xgb_device: "cuda"

model:
  model_type: "conv_bilstm"
  loss_type: "range_preserving"
  lambda_corr: 0.5
  lambda_var: 0.2
  huber_delta: 2.0
  calibration_prompt_sec: 30.0
  lr: 0.0003
  max_epochs: 150
  early_stopping_patience: 15

paths:
  data_processed: "data/processed_dataset3/robustline60_causal"
  results: "reports/experiments/dataset3/robustline60_causal"
  reports_figures: "reports/experiments/dataset3/robustline60_causal/figures"
