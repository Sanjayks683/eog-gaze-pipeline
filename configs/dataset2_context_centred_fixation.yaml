# configs/dataset2_context_centred_fixation.yaml
# ==============================================
# Offline counterpart of dataset2_context_causal_fixation.yaml: centred 60 s
# robust-mean baseline (dataset2_robust_mean.yaml) plus centred context baselines
# and lagged levels, regressors fit on fixation windows only. Uses future samples,
# so it is not comparable to real-time methods. Run preprocess / train_classical
# / compare.

data:
  datasets_to_load:
    - "dataset2"
  window_channel_mode: "all_eog"

preprocessing:
  drift_removal_method: "robust_mean"
  baseline_window_sec: 60.0
  baseline_causal: false
  baseline_clip_mad: 3.0
  context_baselines:
    - ["robust_mean", 30.0]
    - ["robust_mean", 120.0]
  context_lags_sec: [1.0, 2.0, 4.0, 8.0]

cv:
  regression_train_windows: "fixation"

paths:
  data_processed: "data/processed_context_centred"
  results: "reports/experiments/context_centred_fixation"
  reports_figures: "reports/experiments/context_centred_fixation/figures"
